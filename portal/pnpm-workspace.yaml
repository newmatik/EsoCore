# pnpm settings. They live here, not in package.json's "pnpm" field, because
# pnpm 11 (which Dependabot uses) ignores that field and would drop the overrides
# from the lockfile, breaking CI's pnpm 10 frozen install.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
  - vue-demi

overrides:
  ws: '^8.21.0'
  esbuild: '^0.28.1'
  socket.io-parser: '^4.2.7'
  '@fastify/busboy': '^3.2.1'
  '@nuxt/devtools': '^3.3.1'
  '@tiptap/core': '^3.30.5'
  baseline-browser-mapping: '^2.11.0'
  'brace-expansion@^2': '^2.1.7'
  'brace-expansion@>=4 <6': '^5.0.12'
  browserslist: '^4.28.7'
  devalue: '^5.9.3'
  'nanoid@^3': '^3.3.18'
  postcss: '^8.5.23'
  qs: '^6.16.0'
  'svgo@^4': '^4.1.0'
  'tar@^7': '^7.5.21'
  'undici@^8': '^8.10.2'
