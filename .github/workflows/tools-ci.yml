name: Tools CI

# Runs the stdlib-only unit tests for the scripts in tools/.
# The pull_request trigger is not path-filtered (see website-ci.yml for why).
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tools test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tools -v
