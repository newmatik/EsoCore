name: Website CI

# The website had no pull_request CI at all: portal-ci and server-ci are path-filtered to
# their own directories, and pages.yml (which publishes the website) only runs on push to
# main. So website/** changes reached main completely unchecked. pages.yml is included in
# the paths below so a change to the publish workflow is validated by a real build first.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/pages.yml"

defaults:
  run:
    working-directory: website

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-website-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-website-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
