name: Website CI

# The website had no pull_request CI at all, so website/** changes reached main unchecked.
#
# The pull_request trigger is deliberately NOT path-filtered. A workflow skipped by a path
# filter never reports its check run, so a required status check would sit pending forever
# on any PR that doesn't touch website/. Push keeps its filter — required checks only apply
# to PRs. pages.yml is in the push paths so a change to the publish workflow still rebuilds.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build-and-lint:
    name: Website
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # pnpm must be on PATH before setup-node can cache its store. The former
      # actions/cache step pointed at ~/.pnpm-store, which pnpm 10 never uses,
      # so it never saved anything.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
