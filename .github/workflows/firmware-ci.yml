name: Firmware CI

# Runs the host unit tests of the hardware-independent firmware modules
# (firmware/tests/host). They are built with the runner's C compiler; the ARM
# toolchain is not needed, and the target firmware is not built here.
# The pull_request trigger is not path-filtered (see website-ci.yml for why).
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Firmware test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run host unit tests
        working-directory: firmware
        run: make test
