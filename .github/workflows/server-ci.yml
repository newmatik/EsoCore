name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: Server lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pipx is not installed on the Beast runners. Same Poetry as poetry.lock.
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff check
        run: poetry run ruff check .

      - name: Black check
        run: poetry run black --check .

      - name: isort check
        run: poetry run isort --check-only .

  test:
    name: Server test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pipx is not installed on the Beast runners. Same Poetry as poetry.lock.
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run python manage.py test --verbosity=2

  test-postgres:
    name: Server test (PostgreSQL)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: esocore_api.test_settings_postgres
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_DB: esocore_telemetry_fixture
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: local-test-only
      TEST_POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: esocore_telemetry_fixture
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esocore_telemetry_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run PostgreSQL-backed tests
        run: poetry run python manage.py test --verbosity=2
