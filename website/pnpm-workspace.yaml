# pnpm settings. They live here, not in package.json's "pnpm" field, because
# pnpm 11 (which Dependabot uses) ignores that field and would drop the overrides
# from the lockfile, breaking CI's pnpm 10 frozen install.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

# Do not override simple-git to ^4: @nuxt/devtools 3.x does `import Git from 'simple-git'`,
# and v4 dropped the default export, so `nuxt dev` fails to load devtools. The open
# simple-git alerts are dev-only (devtools runs it with fixed args against rootDir) and
# go away with @nuxt/devtools 4, which no longer depends on simple-git.
overrides:
  '@fastify/busboy': '^3.2.1'
  'brace-expansion@^2': '^2.1.7'
  'brace-expansion@>=4 <6': '^5.0.12'
  devalue: '^5.9.3'
  qs: '^6.16.0'
  'svgo@^4': '^4.1.0'
  'undici@^8': '^8.10.2'
