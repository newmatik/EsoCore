[tool.poetry]
name = "newmatik-esocore-server"
version = "0.1.0"
description = "EsoCore Django REST API"
authors = ["Newmatik"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
django = "5.2.14"
djangorestframework = "3.16.1"
django-cors-headers = "4.9.0"
djangorestframework-api-key = "3.1.0"
drf-spectacular = "0.29.0"
django-filter = "25.2"
python-dotenv = "1.2.2"
requests = "2.33.0"
# Transitive via requests; pinned to clear GHSA advisories (urllib3 < 2.7.0, idna < 3.15).
urllib3 = ">=2.7.0"
idna = ">=3.15"
psycopg2-binary = "2.9.11"
django-unfold = ">=0.79.0,<0.80.0"
django-crispy-forms = ">=2.4,<3.0"


[tool.poetry.group.dev.dependencies]
ruff = "0.15.0"
black = "26.3.1"
isort = "7.0.0"

# Scripts are defined in package.json style format for easier execution

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long, let black handle this
    "B008",   # Do not perform function calls in argument defaults
    "C901",   # Too complex
    "PT009",  # unittest-style assertions are idiomatic in Django TestCase
    "PT027",  # unittest-style assertRaises is idiomatic in Django TestCase
    "RUF012", # Mutable class defaults are standard in Django models/serializers
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/migrations/*.py" = ["E501", "N805"]
"**/tests/*.py" = ["S101"]
"scripts/*.py" = ["T201"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["esocore_api", "devices", "users", "telemetry", "events", "iot", "assets"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

